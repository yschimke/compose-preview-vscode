name: 'Preview Comment'
description: >
  Render the `preview-harness` fixtures (every fixture × dark/light theme), compare
  against the baselines on `preview/main`, and post a sticky before/after comment on
  the PR. Changed PNGs are appended as a new commit on the shared `preview/pr` branch;
  the comment pins Before/After URLs to commit SHAs so the images keep resolving after
  merge.

  Copied from yschimke/compose-ai-tools with this repository's harness as the producer.

inputs:
  base-branch:
    description: 'Branch name for the baselines.'
    default: 'preview/main'
  head-branch:
    description: 'Shared branch that accumulates per-PR render commits.'
    default: 'preview/pr'
  pr-number:
    description: 'Pull request number (auto-detected from context if omitted).'
    default: ''
  comment-on-empty-diff:
    description: >
      When `false` (default), skip posting a fresh PR comment if there are no preview
      changes in this run — avoids notifying reviewers about a "no visual changes"
      comment on every push. An existing diff comment is still patched in place to
      reflect the empty state (PATCHing doesn't notify). Set `true` to always post.
    default: 'false'
  node-version:
    description: 'Node.js version for the harness.'
    default: '20'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Playwright browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Capture harness snapshots
      shell: bash
      run: npm run harness:snapshot

    # The wire-side contract. Catches regressions a visual diff cannot see — e.g.
    # activating the Accessibility chip stops posting `setDataExtensionEnabled` for a
    # default-ON kind, which moves no pixels.
    - name: Run harness contract
      shell: bash
      run: npm run harness:contract

    - name: Fetch baselines
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        mkdir -p _baselines
        if git ls-remote --exit-code origin "$BASE_BRANCH" >/dev/null 2>&1; then
          git fetch origin "$BASE_BRANCH"
          git show "origin/${BASE_BRANCH}:baselines.json" \
            > _baselines/baselines.json 2>/dev/null || true
          # Extract the baseline `renders/` tree alongside `baselines.json` so the
          # pixelmatch filter has both PNGs to diff. Without it the harness's ±1-channel
          # antialiased-edge jitter (Chromium rasterisation is not bitwise-deterministic
          # between runs) trips the sha comparison and surfaces a fake "changed" row in
          # every PR. `git archive` writes to stdout so the working tree is untouched.
          git archive "origin/${BASE_BRANCH}" renders 2>/dev/null \
            | tar -x -C _baselines/ 2>/dev/null || true
        else
          echo "No $BASE_BRANCH branch yet — treating all captures as new."
        fi

    - name: Install perceptual-diff dependencies
      shell: bash
      run: |
        python3 -m pip install --quiet 'pixelmatch==0.4.0' 'Pillow>=10' \
          || echo "pixelmatch install failed; falling back to strict-bytes diff" >&2

    - name: Resolve Before ref
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
      run: |
        set -euo pipefail
        BASE_SHA=$(git ls-remote \
          "https://x-access-token:${GITHUB_TOKEN_INLINE}@github.com/${REPO}.git" \
          "refs/heads/${BASE_BRANCH}" | awk '{print $1}')
        # First-ever run — fall back to the branch name; Before images 404 until the
        # first baseline push lands, after which new comments resolve to a SHA.
        if [ -z "$BASE_SHA" ]; then
          BASE_SHA="$BASE_BRANCH"
        fi
        echo "$BASE_SHA" > _base_sha

    - name: Copy changed captures
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "$ACTION_PATH/../lib/preview-diff.py" copy-changed \
          preview-harness/out \
          --baselines _baselines/baselines.json \
          --baseline-renders _baselines/renders \
          --output-dir _pr_renders

    - name: Push PR captures
      shell: bash
      env:
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
      run: |
        set -euo pipefail
        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"

        if [ ! -d _pr_renders/renders ] || \
           [ -z "$(ls -A _pr_renders/renders 2>/dev/null)" ]; then
          echo "No changed captures to push."
          : > "$GITHUB_WORKSPACE/_head_sha"
          exit 0
        fi

        cd _pr_renders
        git init -q
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add origin \
          "https://x-access-token:${GITHUB_TOKEN_INLINE}@github.com/${REPO}.git"

        git add -A
        TREE=$(git write-tree)

        MSG="Preview captures for PR #${PR_NUMBER} (${GITHUB_SHA::8})"

        # Retry-on-race — different PRs push to the same shared branch and
        # second-to-push hits "non-fast-forward".
        attempt=1
        while :; do
          PARENT=""
          if git fetch --depth=1 --quiet origin "$HEAD_BRANCH" 2>/dev/null; then
            PARENT=$(git rev-parse FETCH_HEAD)
          fi
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          if git push --quiet origin "${COMMIT}:refs/heads/${HEAD_BRANCH}" 2>&1; then
            echo "$COMMIT" > "$GITHUB_WORKSPACE/_head_sha"
            exit 0
          fi
          if [ "$attempt" -ge 5 ]; then
            echo "Push to ${HEAD_BRANCH} failed after ${attempt} attempts." >&2
            exit 1
          fi
          delay=$((attempt * 2 + RANDOM % 3))
          echo "Push to ${HEAD_BRANCH} lost the race; retry ${attempt}/5 in ${delay}s…" >&2
          attempt=$((attempt + 1))
          sleep "$delay"
        done

    - name: Generate comment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
      run: |
        set -euo pipefail
        BASE_REF=$(cat _base_sha)
        HEAD_REF=$(cat _head_sha 2>/dev/null || true)
        if [ -z "$HEAD_REF" ]; then
          HEAD_REF="$HEAD_BRANCH"
        fi

        python3 "$ACTION_PATH/../lib/preview-diff.py" compare \
          preview-harness/out \
          --baselines _baselines/baselines.json \
          --baseline-renders _baselines/renders \
          --repo "$REPO" \
          --base-ref "$BASE_REF" \
          --head-ref "$HEAD_REF" \
          --base-branch "$BASE_BRANCH" \
          > _comment_body.md

    - name: Post or update PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMENT_ON_EMPTY_DIFF: ${{ inputs.comment-on-empty-diff }}
      run: |
        set -euo pipefail
        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        BODY=$(cat _comment_body.md)
        MARKER="<!-- preview-diff -->"

        COMMENT_ID=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
          | head -1)

        if grep -qF "No visual changes detected." _comment_body.md \
           && [ "$COMMENT_ON_EMPTY_DIFF" != "true" ] \
           && [ -z "$COMMENT_ID" ]; then
          echo "No preview diff and no existing comment — skipping (comment-on-empty-diff=false)."
          exit 0
        fi

        if [ -n "$COMMENT_ID" ]; then
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            -X PATCH -f body="$BODY"
        else
          gh pr comment "$PR_NUMBER" --body "$BODY"
        fi
