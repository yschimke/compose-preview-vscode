name: 'Preview Baselines'
description: >
  Render every `preview-harness` fixture × dark/light theme and publish the PNGs plus
  `baselines.json` to the baseline branch, so it is a browsable gallery on GitHub and
  serves as the "before" state for the preview-comment action on PRs.

  Copied from yschimke/compose-ai-tools, where the same shape publishes the
  `compose-preview serve` page captures. The two repositories capture different
  surfaces onto different branches; the split is what makes them independent.

inputs:
  branch:
    description: 'Branch the baselines are published to.'
    default: 'preview/main'
  node-version:
    description: 'Node.js version for the harness.'
    default: '20'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci

    # Playwright's bundled chromium isn't in the standard runner image; `--with-deps`
    # pulls the apt packages it needs (libnss3, libxkbcommon, ...). Without it the
    # harness fails at `chromium.launch()` before any fixture runs.
    - name: Install Playwright browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Capture harness snapshots
      shell: bash
      run: npm run harness:snapshot

    # The wire-side contract: asserts each fixture's `expectedPosts` /
    # `forbiddenPosts` match the `vscode.postMessage` calls its actions produced.
    # Failing here on a baseline run flags a regression that landed without a
    # contract violation surfacing on the PR.
    - name: Run harness contract
      shell: bash
      run: npm run harness:contract

    - name: Fetch prior baselines
      shell: bash
      env:
        BASELINE_BRANCH: ${{ inputs.branch }}
      run: |
        # Pull the prior `renders/` tree so the generate step can reuse
        # pixelmatch-clean PNGs verbatim. Without this, every push lands a no-op
        # baseline commit when Chromium AA jitter flips the bytes of an otherwise
        # unchanged capture. Absent branch (first-ever run) falls back to a strict
        # regenerate, which is exactly what seeding this branch needs.
        mkdir -p _prior
        if git ls-remote --exit-code origin "$BASELINE_BRANCH" >/dev/null 2>&1; then
          git fetch --depth=1 --quiet origin "$BASELINE_BRANCH"
          git archive FETCH_HEAD renders 2>/dev/null | tar -x -C _prior/ 2>/dev/null || true
        fi

    - name: Install perceptual-diff dependencies
      shell: bash
      run: |
        # pixelmatch (Mapbox; AA-aware) collapses the antialiased-edge jitter the
        # harness emits between runs. Install failure falls back to strict-bytes
        # generate — noisier history, still correct.
        python3 -m pip install --quiet 'pixelmatch==0.4.0' 'Pillow>=10' \
          || echo "pixelmatch install failed; falling back to strict-bytes generate" >&2

    - name: Stage baselines
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "$ACTION_PATH/../lib/preview-diff.py" generate \
          preview-harness/out \
          --prior-renders _prior/renders \
          --output-dir _baselines

    - name: Push to baselines branch
      shell: bash
      env:
        BASELINE_BRANCH: ${{ inputs.branch }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
      run: |
        set -euo pipefail
        cd _baselines

        git init -q
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add origin \
          "https://x-access-token:${GITHUB_TOKEN_INLINE}@github.com/${REPO}.git"

        git add -A
        TREE=$(git write-tree)

        # Append to history rather than force-pushing a fresh orphan each run, so PR
        # comments pinned to a past baseline SHA stay resolvable forever.
        PARENT=""
        if git fetch --depth=1 --quiet origin "$BASELINE_BRANCH" 2>/dev/null; then
          PARENT=$(git rev-parse FETCH_HEAD)
          PARENT_TREE=$(git rev-parse "${PARENT}^{tree}")
          if [ "$TREE" = "$PARENT_TREE" ]; then
            echo "Baselines unchanged vs ${BASELINE_BRANCH}; skipping push."
            exit 0
          fi
        fi

        MSG="Update preview baselines from ${GITHUB_SHA::8}"
        if [ -n "$PARENT" ]; then
          COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
        else
          COMMIT=$(git commit-tree "$TREE" -m "$MSG")
        fi

        git push --quiet origin "${COMMIT}:refs/heads/${BASELINE_BRANCH}"
