name: PR Title

# Enforces conventional-commit format on pull request titles. Matters because
# PRs are squash-merged with the PR title as the commit headline, and
# release-please only bumps the version / populates the changelog from commits
# whose headline matches `<type>(<scope>)?: <subject>`.
#
# The allowed types mirror what release-please understands: `feat` and `fix`
# drive minor/patch bumps; the rest (`chore`, `docs`, `refactor`, …) still land
# in the changelog under their section and keep history scannable.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of a pull request whose head a workflow pushed, checked on its head branch
        required: true
        type: number

# `workflow_dispatch` is for pull request heads a workflow pushed (`Sync daemon pin`).
# GitHub starts no workflow for anything done with GITHUB_TOKEN, so such a PR never gets the
# `pull_request` run this check is required from, and its auto-merge waits forever. The workflow
# that pushed it dispatches this one on the PR's branch with the PR's number instead; the run
# reports the same check name on the branch head, which is the commit the ruleset reads. It refuses
# when the PR's head is not that commit, so it never certifies a commit the PR no longer has.

permissions:
  contents: read
  pull-requests: read

# Pushes supersede; title edits deliberately do NOT.
#
# Without any group the workflow accumulated a run per event — 17 were still
# live on merged, deleted branches on 2026-08-08, each holding a queue slot.
# Superseding on push is the plain, safe case: a new head SHA gets its own
# check, and a run that loses its race reported on a commit that is no longer
# the head, so nothing is gated on it.
#
# `edited` is not that case. Title edits do NOT change the head SHA, so a check
# from an edit stays attached to the very commit the merge gate reads. Group
# execution order is not guaranteed, so an older `edited` run can enter after a
# newer one and cancel it — and `action-semantic-pull-request` validates the
# title frozen into its own event payload. The survivor would then certify a
# title that has since been replaced by an invalid one, on the same SHA, and
# the required check goes green over it.
#
# The attribution workflow solves this by re-reading the PR; that is not
# available here, because the action reads the payload itself rather than
# taking a title as input. So edits get a group of their own instead and never
# cancel each other. That costs at most a few seconds per edit — this job runs
# in about three — and it is the difference between a gate and a suggestion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.run_id || 'head' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Subset release-please recognises. Keep in sync with any custom
          # release-please commit-types config (none currently — defaults).
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
            style
            revert
          requireScope: false

      # The action reads its event payload, which a dispatch does not carry, so the dispatched run
      # applies the same rule to the PR's current title itself. Keep the types in step with the
      # list above.
      - name: Check the PR's title on a dispatched run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr_head="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::error::#${PR}'s head is ${pr_head}, not ${HEAD_SHA}; dispatch on its branch"
            exit 1
          fi
          title="$(gh pr view "$PR" --json title --jq .title)"
          types='feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert'
          if [[ ! "$title" =~ ^(${types})(\([^\)]+\))?!?:\ [^[:space:]] ]]; then
            echo "::error::#${PR}'s title is not a Conventional Commit"
            printf 'title: %s\n' "$title"
            exit 1
          fi
          echo "#${PR}: ${title}"
