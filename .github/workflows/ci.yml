# Everything that used to run as the `VS Code Extension Tests` and the format
# job in yschimke/compose-ai-tools' ci.yml, minus the path filters — in a repo
# that is only the extension, every PR is an extension PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The `preview-harness` run lives in `preview-comment.yml` (per-PR visual diff) and
# `preview-baselines.yml` (publish on main), not here — running it in both would pay for
# Chromium and the whole fixture sweep twice on every PR that touches the panel.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Compile
        run: npm run compile
      - name: Unit tests
        run: npm test
      - name: Integration tests (xvfb)
        run: xvfb-run -a npm run test:electron
      - name: Package
        run: npm run package
